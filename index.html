<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Content Coordinator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Netflix Content Coordinator</h1>

    <div id="status">Loading data...</div>

    <div class="buttons">
        <button id="pg13Btn">Show PG-13 Titles</button>
        <button id="longBtn">Movies Longer Than 90 Minutes</button>
        <button id="resetBtn">Show All</button>
    </div>

    <div class="filters">
        <input id="searchInput" type="search" placeholder="Search title..." />
        <label class="muted">Upload CSV:
            <input id="csvFileInput" type="file" accept=".csv" />
        </label>
        <select id="genreSelect">
            <option value="">All genres</option>
        </select>
        <select id="countrySelect">
            <option value="">All countries</option>
        </select>
        <select id="ratingSelect">
            <option value="">All ratings</option>
        </select>
        <button id="applyFiltersBtn">Apply</button>
        <button id="clearFiltersBtn">Clear</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Genre</th>
                <th>Rating</th>
                <th>Duration</th>
                <th>Type</th>
            </tr>
        </thead>

        <tbody id="movieTable"></tbody>
    </table>

    <div class="pagination" style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;">
        <button id="prevPage">Prev</button>
        <button id="firstPage"><<</button>
        <button id="prevPage">Prev</button>
        <div id="pageButtons" style="display:inline-flex;gap:6px;align-items:center;"></div>
        <button id="nextPage">Next</button>
        <button id="lastPage">>></button>
        <label style="margin-left:8px;" class="muted">Per page:
            <select id="pageSizeSelect">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </label>
    </div>

    <div id="spinner" aria-hidden="true" style="display:none;text-align:center;margin-top:10px;">
        <svg width="48" height="48" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" stroke="#2b6cb0" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="31.4 31.4">
                <animateTransform attributeName="transform" type="rotate" values="0 25 25;360 25 25" dur="1s" repeatCount="indefinite" />
            </circle>
        </svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
